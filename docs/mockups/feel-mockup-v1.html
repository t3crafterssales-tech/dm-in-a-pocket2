<title>DM in a Pocket Feel Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya:wght@500;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: two columns like the real app will have: the sheet in the middle, the Codex on the right with a small flag strip at its foot. On a phone the Codex becomes its own tab. */
:root{
  --bg:#efe9df; --paper:#fbf8f2; --card:#ffffff; --ink:#2a211a; --muted:#7a6a5c; --line:#e1d6c6; --chip:#f1e9dd;
  --accent:#7a4520; --accent-2:#a8622f; --accent-soft:#f3e3d2; --accent-ink:#fff8f0;
  --yellow:#a07508; --yellow-soft:#f8eecd; --red:#a83a2b; --red-soft:#f6dfda; --green:#2f7a4f; --green-soft:#dcefe3;
  --display:"Alegreya SC", Georgia, serif; --title:"Alegreya", Georgia, serif; --body:"Source Sans 3", system-ui, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --paper:#1f1a15; --card:#28211b; --ink:#efe6da; --muted:#b09d8a; --line:#3b3128; --chip:#332a22;
  --accent:#d99a5c; --accent-2:#e7b07a; --accent-soft:#3d2c1d; --accent-ink:#1d140c;
  --yellow:#e2bb4a; --yellow-soft:#3a3016; --red:#e47a68; --red-soft:#3d221d; --green:#6cc394; --green-soft:#1b3326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --paper:#1f1a15; --card:#28211b; --ink:#efe6da; --muted:#b09d8a; --line:#3b3128; --chip:#332a22;
  --accent:#d99a5c; --accent-2:#e7b07a; --accent-soft:#3d2c1d; --accent-ink:#1d140c;
  --yellow:#e2bb4a; --yellow-soft:#3a3016; --red:#e47a68; --red-soft:#3d221d; --green:#6cc394; --green-soft:#1b3326; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--accent-2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--line)}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical;min-height:70px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Top bar */
.top{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-size:18px}
.wname{font-family:var(--title);font-weight:700;font-size:20px;line-height:1.1}
.wname small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.top .spacer{flex:1}
.newbtn{font-size:15px;padding:8px 16px}
.mtabs{display:none}

/* Main two columns */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding-bottom:12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{overflow:auto;flex:1;min-height:0}

/* Start screen */
.start{padding:28px 24px;max-width:760px;margin:0 auto;width:100%}
.start h1{font-family:var(--display);font-size:30px;margin:0 0 4px}
.start p{margin:0 0 20px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:left;min-height:118px}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .ic{font-size:28px;line-height:1}
.tile b{font-family:var(--title);font-size:18px}
.tile span{font-size:13px;color:var(--muted)}
.tile.soon{opacity:.55}
.recent{margin-top:26px}
.recent h2,.section-h{font-family:var(--title);font-size:17px;margin:0 0 8px}
.recent-list{display:flex;gap:8px;flex-wrap:wrap}
.pill{border-radius:999px;padding:6px 12px;background:var(--card);border:1px solid var(--line);font-size:14px}

/* Starting point picker */
.pick{padding:24px;max-width:760px;margin:0 auto;width:100%}
.pick h1{font-family:var(--display);font-size:26px;margin:0 0 4px}
.starts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:16px}
.startcard{display:flex;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:12px;background:var(--card)}
.startcard .ic{font-size:24px}
.startcard b{display:block;font-family:var(--title);font-size:16px}
.startcard small{color:var(--muted)}

/* Sheet */
.sheet{padding:22px 24px 40px;max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px}
.head{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;align-items:start}
.portrait{width:120px;height:120px;border-radius:14px;border:2px dashed var(--line);background:var(--chip);display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;overflow:hidden;position:relative}
.portrait img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.portrait .big{font-size:40px;display:block}
.name{font-family:var(--display);font-size:30px;border:1px solid transparent;background:transparent;padding:2px 6px;margin-left:-6px;width:100%;border-radius:8px}
.name:hover,.name:focus{border-color:var(--line);background:var(--card)}
.oneline{width:100%;border:1px solid transparent;background:transparent;padding:4px 6px;margin-left:-6px;color:var(--muted);font-style:italic}
.oneline:hover,.oneline:focus{border-color:var(--line);background:var(--card);font-style:normal;color:var(--ink)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.q label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;background:var(--chip);border:1px solid transparent;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.add{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.numunit{display:flex;gap:6px}
.numunit input{width:90px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:34px;height:34px;padding:0;font-size:18px}
.stepper input{width:74px;text-align:center}
.unitswitch{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.unitswitch button{border:0;border-radius:0;padding:6px 10px;background:transparent}
.unitswitch button.on{background:var(--accent);color:var(--accent-ink)}
.prints{border-left:3px solid var(--accent);background:var(--card);border-radius:0 10px 10px 0;padding:12px 16px}
.prints h3{font-family:var(--title);margin:0 0 2px;font-size:18px}
.prints .stat{font-size:13px;color:var(--muted);margin-bottom:6px}
.prints p{margin:4px 0}
.prints .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
details.more{border:1px solid var(--line);border-radius:12px;background:var(--card)}
details.more>summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.more[open]>summary::before{transform:rotate(90deg)}
details.more .inner{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.ench{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.ench .t{flex:1;min-width:0}
.ench b{display:block}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--muted);font-size:14px}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Codex */
.codex-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.codex-head h2{font-family:var(--display);font-size:20px;margin:0;flex:1}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.sec{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:10px;background:var(--card);text-align:left}
.sec .ic{font-size:20px}
.sec b{font-family:var(--title);font-size:16px}
.sec small{color:var(--muted);font-size:12px}
.sec.over{border-color:var(--accent);background:var(--accent-soft)}
.secpills{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 4px;scrollbar-width:thin}
.secpills button{white-space:nowrap;border-radius:999px;padding:4px 10px;font-size:13px}
.secpills button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.secpills button.over{background:var(--accent-soft);border-color:var(--accent)}
.view{display:flex;gap:6px;padding:6px 12px;flex-wrap:wrap;align-items:center}
.view select,.view input{font-size:13px;padding:5px 8px}
.view input{flex:1;min-width:120px}
.entries{padding:4px 8px 12px}
.entry{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:grab;user-select:none}
.entry:hover{background:var(--chip)}
.entry .ic{width:34px;height:34px;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-size:18px;flex:none}
.entry .t{flex:1;min-width:0}
.entry b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry small{color:var(--muted);font-size:12px}
.entry .acts{display:flex;gap:4px}
.entry .acts button{padding:4px 8px;font-size:12px}
.mine{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:999px;margin-left:6px}
.hint{font-size:12px;color:var(--muted);padding:0 14px 10px}

/* Flag strip */
.flagstrip{border-top:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:4px;background:var(--paper);cursor:pointer;text-align:left;border-radius:0;border-left:0;border-right:0;border-bottom:0}
.flagstrip .fh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.flagstrip .fh .count{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.fl{display:flex;gap:8px;align-items:baseline;font-size:13px}
.dot{width:8px;height:8px;border-radius:999px;flex:none;transform:translateY(-1px)}
.dot.y{background:var(--yellow)}.dot.r{background:var(--red)}.dot.g{background:var(--green)}

/* Modal + toast */
.scrim{position:fixed;inset:0;background:rgba(20,12,6,.45);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--paper);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal header{padding:16px 18px 6px;font-family:var(--display);font-size:22px}
.modal .mb{padding:6px 18px 12px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal footer{padding:10px 18px 16px;display:flex;justify-content:flex-end;gap:8px}
.flagrow{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-left-width:4px;border-radius:8px;background:var(--card)}
.flagrow.y{border-left-color:var(--yellow)}.flagrow.r{border-left-color:var(--red)}.flagrow.g{border-left-color:var(--green)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.note{background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}

@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr)}
  .mtabs{display:flex;gap:6px;padding-bottom:8px}
  .mtabs button{flex:1}
  .mtabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .main>.panel:not(.mshow){display:none}
  .head{grid-template-columns:84px minmax(0,1fr);gap:12px}
  .portrait{width:84px;height:84px}
  .name{font-size:24px}
  .sheet,.start,.pick{padding:16px 14px 32px}
  .top .hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY="dmip-feel-mockup-1";

/* ---------- Starter content (the Codex) ---------- */
const SECTIONS=[
  ["weapons","Weapons","⚔️"],["armour","Armour","🛡️"],["gear","Gear","🏮"],["enchant","Enchantments","✨"],
  ["spells","Spells","📜"],["monsters","Monsters","🐉"],["races","Races","🧝"],["classes","Classes","🎭"]
];
const W=(name,dice,dtype,hand,mat,wt,cost,props,ic)=>({id:uid(),sec:"weapons",kind:"weapon",name,ic:ic||"⚔️",src:"starter",f:{dice,dtype,hand,mat,wt,cost:cost[0],cur:cost[1],props:props||[]},ench:[],line:""});
const START=[
  W("Battleaxe","1d8","slashing","Versatile","Steel",4,[10,"gp"],[],"🪓"),
  W("Greataxe","1d12","slashing","Two-handed","Steel",7,[30,"gp"],["Heavy"],"🪓"),
  W("Handaxe","1d6","slashing","One-handed","Steel",2,[5,"gp"],["Light","Thrown"],"🪓"),
  W("Longsword","1d8","slashing","Versatile","Steel",3,[15,"gp"],[]),
  W("Shortsword","1d6","piercing","One-handed","Steel",2,[10,"gp"],["Finesse","Light"]),
  W("Dagger","1d4","piercing","One-handed","Steel",1,[2,"gp"],["Finesse","Light","Thrown"],"🗡️"),
  W("Club","1d4","bludgeoning","One-handed","Wood",2,[1,"sp"],["Light"],"🏏"),
  W("Warhammer","1d8","bludgeoning","Versatile","Iron",2,[15,"gp"],[],"🔨"),
  W("Quarterstaff","1d6","bludgeoning","Versatile","Wood",4,[2,"sp"],[],"🪄"),
  W("Shortbow","1d6","piercing","Two-handed","Wood",2,[25,"gp"],["Ranged"],"🏹"),
  {id:uid(),sec:"armour",kind:"armour",name:"Leather Armour",ic:"🦺",src:"starter",f:{ac:11,type:"Light",mat:"Leather",wt:10,cost:10,cur:"gp",stealth:false},ench:[],line:""},
  {id:uid(),sec:"armour",kind:"armour",name:"Chain Mail",ic:"⛓️",src:"starter",f:{ac:16,type:"Heavy",mat:"Steel",wt:55,cost:75,cur:"gp",stealth:true},ench:[],line:""},
  {id:uid(),sec:"armour",kind:"armour",name:"Shield",ic:"🛡️",src:"starter",f:{ac:2,type:"Shield",mat:"Wood",wt:6,cost:10,cur:"gp",stealth:false},ench:[],line:""},
  {id:uid(),sec:"gear",kind:"gear",name:"Hooded Lantern",ic:"🏮",src:"starter",f:{light:30,dim:30,burn:6,fuel:"Oil",mat:"Iron",wt:2,cost:5,cur:"gp"},ench:[],line:"Casts bright light; the hood can be lowered to dim it."},
  {id:uid(),sec:"gear",kind:"gear",name:"Torch",ic:"🔥",src:"starter",f:{light:20,dim:20,burn:1,fuel:"Pitch",mat:"Wood",wt:1,cost:1,cur:"cp"},ench:[],line:""},
  {id:uid(),sec:"gear",kind:"gear",name:"Rope (50 ft)",ic:"🪢",src:"starter",f:{light:0,dim:0,burn:0,fuel:"None",mat:"Hemp",wt:10,cost:1,cur:"gp"},ench:[],line:""},
  {id:uid(),sec:"enchant",kind:"enchant",name:"Flaming",ic:"🔥",src:"starter",f:{when:"On a hit",dice:"1d6",dtype:"fire"},text:"wreathed in flame"},
  {id:uid(),sec:"enchant",kind:"enchant",name:"Frost",ic:"❄️",src:"starter",f:{when:"On a hit",dice:"1d6",dtype:"cold"},text:"rimed with ice"},
  {id:uid(),sec:"enchant",kind:"enchant",name:"Thundering",ic:"⚡",src:"starter",f:{when:"On a critical hit",dice:"2d6",dtype:"thunder"},text:"booms like thunder"},
  {id:uid(),sec:"enchant",kind:"enchant",name:"Returning",ic:"↩️",src:"starter",f:{when:"Always",dice:"",dtype:""},text:"flies back to your hand after being thrown"},
  {id:uid(),sec:"enchant",kind:"enchant",name:"Glowing",ic:"💡",src:"starter",f:{when:"Always",dice:"",dtype:""},text:"sheds dim light for 10 feet"},
  {id:uid(),sec:"spells",kind:"spell",name:"Fire Bolt",ic:"🔥",src:"starter",f:{lvl:0},line:"A mote of fire, 1d10 fire damage."},
  {id:uid(),sec:"spells",kind:"spell",name:"Magic Missile",ic:"✨",src:"starter",f:{lvl:1},line:"Three darts of force that always hit."},
  {id:uid(),sec:"spells",kind:"spell",name:"Shield",ic:"🛡️",src:"starter",f:{lvl:1},line:"+5 armour until your next turn."},
  {id:uid(),sec:"monsters",kind:"monster",name:"Goblin",ic:"👺",src:"starter",f:{cr:"1/4"},line:"Small, cruel and cowardly alone."},
  {id:uid(),sec:"monsters",kind:"monster",name:"Orc",ic:"👹",src:"starter",f:{cr:"1/2"},line:""},
  {id:uid(),sec:"monsters",kind:"monster",name:"Wolf",ic:"🐺",src:"starter",f:{cr:"1/4"},line:""},
  {id:uid(),sec:"monsters",kind:"monster",name:"Ogre",ic:"🧌",src:"starter",f:{cr:"2"},line:""},
  {id:uid(),sec:"races",kind:"race",name:"Dwarf",ic:"⛏️",src:"starter",f:{},line:""},
  {id:uid(),sec:"races",kind:"race",name:"Elf",ic:"🧝",src:"starter",f:{},line:""},
  {id:uid(),sec:"classes",kind:"class",name:"Fighter",ic:"⚔️",src:"starter",f:{},line:""},
  {id:uid(),sec:"classes",kind:"class",name:"Cleric",ic:"✝️",src:"starter",f:{},line:""}
];
const DICE=["1d4","1d6","1d8","1d10","1d12","2d6","2d8"];
const DTYPES=["slashing","piercing","bludgeoning","fire","cold","lightning","acid","poison","necrotic","radiant","force","thunder","psychic"];
const HANDS=["One-handed","Two-handed","Versatile"];
const PROPS=["Light","Heavy","Finesse","Thrown","Reach","Ranged","Loading","Silvered"];
const MATS=["Wood","Bone","Stone","Leather","Hemp","Bronze","Iron","Steel","Silver","Gold","Mithral","Adamantine","Obsidian","Crystal"];
const CURS=["cp","sp","gp","pp"];
const ARMOUR_TYPES=["Light","Medium","Heavy","Shield"];
const FUELS=["Oil","Pitch","Candle wax","Magic","None"];

let S=null;
try{const t=localStorage.getItem(KEY); if(t) S=JSON.parse(t);}catch(e){}
if(!S||!S.codex) S={codex:START, mats:MATS.slice(), units:"lb", view:"start", openId:null, sec:null, sort:"az", src:"all", q:"", recent:[], flags:[], seen:0};
const UI={modal:null, mpane:"sheet", toast:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const byId=id=>S.codex.find(x=>x.id===id);
const secOf=k=>SECTIONS.find(s=>s[0]===k);

/* ---------- Plain-English text ---------- */
function weightText(lb){ if(!lb&&lb!==0) return ""; return S.units==="kg" ? (Math.round(lb*0.4536*10)/10)+" kg" : lb+" lb"; }
function enchSentence(e){ const f=e.f; if(f.dice) return (f.when==="Always"?"":f.when+", ")+"deals an extra "+f.dice+" "+f.dtype+" damage."; return "It "+e.text+"."; }
function prints(it){
  const f=it.f; let stat="", lines=[];
  if(it.kind==="weapon"){
    stat=[f.cost+" "+f.cur, weightText(f.wt), f.mat].filter(Boolean).join(" · ");
    let s="Weapon ("+f.hand.toLowerCase()+"). Deals "+f.dice+" "+f.dtype+" damage";
    if(f.hand==="Versatile") s+=" (one size bigger when used with two hands)";
    s+="."; lines.push(s);
    if(f.props.length) lines.push("Properties: "+f.props.join(", ")+".");
  } else if(it.kind==="armour"){
    stat=[f.cost+" "+f.cur, weightText(f.wt), f.mat].filter(Boolean).join(" · ");
    lines.push((f.type==="Shield"?"Shield. Adds +"+f.ac+" to armour.":f.type+" armour. Armour "+f.ac+(f.type==="Light"?" + Dexterity":f.type==="Medium"?" + Dexterity (up to 2)":"")+".")+(f.stealth?" Disadvantage on Stealth.":""));
  } else if(it.kind==="gear"){
    stat=[f.cost+" "+f.cur, weightText(f.wt), f.mat].filter(Boolean).join(" · ");
    if(f.light) lines.push("Bright light for "+f.light+" ft and dim light for "+f.dim+" ft more. Burns for "+f.burn+" hour"+(f.burn==1?"":"s")+" on "+f.fuel.toLowerCase()+".");
  }
  (it.ench||[]).forEach(e=>lines.push(e.name+". "+enchSentence(e)));
  if(it.line) lines.unshift(it.line);
  return {stat, lines};
}

/* ---------- Flags (simple, free checks) ---------- */
function computeFlags(){
  const out=[]; const mine=S.codex.filter(x=>x.src==="mine");
  const names={}; S.codex.forEach(x=>{const k=x.sec+"|"+x.name.trim().toLowerCase(); (names[k]=names[k]||[]).push(x);});
  Object.values(names).forEach(list=>{ if(list.length>1&&list.some(x=>x.src==="mine")) out.push({c:"y",t:"Two "+secOf(list[0].sec)[1].toLowerCase()+" are called "+list[0].name,s:"Usually one was copied by accident."}); });
  mine.forEach(x=>{
    if(x.kind==="weapon"){
      const base=S.codex.find(b=>b.src==="starter"&&b.kind==="weapon"&&b.f.dice===x.f.dice);
      const g=v=>v.f.cost*({cp:.01,sp:.1,gp:1,pp:10}[v.f.cur]||1);
      if(base&&g(x)>g(base)*3) out.push({c:"y",t:x.name+" costs a lot more than "+base.name,s:"Same damage ("+x.f.dice+"), but "+x.f.cost+" "+x.f.cur+" against "+base.f.cost+" "+base.f.cur+"."});
      if(x.sec!=="weapons") out.push({c:"y",t:x.name+" is a weapon filed under "+secOf(x.sec)[1]+". Intended?",s:"It's allowed. Ignore this if it's on purpose."});
    }
  });
  return out;
}

/* ---------- Render ---------- */
const app=$("#app");
function render(){
  const ae=document.activeElement, fid=ae&&ae.id; let ss=null; try{ss=ae.selectionStart;}catch(e){}
  const sc={}; document.querySelectorAll("[data-scroll]").forEach(el=>sc[el.dataset.scroll]=el.scrollTop);
  const flags=computeFlags();
  let h='<header class="top"><div class="logo" aria-hidden="true">D</div><div class="wname">Greyhollow<small>World · d20 Basic</small></div><span class="spacer"></span>'+
    '<button class="ghost hide-s" data-act="home" title="Back to the start">Start</button><button class="ghost" data-act="settings">Settings</button><button class="primary newbtn" data-act="new">+ New</button></header>';
  h+='<nav class="mtabs"><button class="'+(UI.mpane==="sheet"?"on":"")+'" data-act="mpane" data-p="sheet">Sheet</button><button class="'+(UI.mpane==="codex"?"on":"")+'" data-act="mpane" data-p="codex">Codex</button></nav>';
  h+='<div class="main"><section class="panel '+(UI.mpane==="sheet"?"mshow":"")+'"><div class="scroll" data-scroll="sheet" data-drop="sheet">'+center()+'</div></section>';
  h+='<aside class="panel '+(UI.mpane==="codex"?"mshow":"")+'">'+codex()+flagStrip(flags)+'</aside></div>';
  if(UI.modal) h+=modal(flags);
  if(UI.toast) h+='<div class="toast" role="status">'+esc(UI.toast)+'</div>';
  app.innerHTML=h;
  document.querySelectorAll("[data-scroll]").forEach(el=>{if(sc[el.dataset.scroll]!=null) el.scrollTop=sc[el.dataset.scroll];});
  if(fid){const el=document.getElementById(fid); if(el){el.focus(); try{if(ss!=null) el.setSelectionRange(ss,ss);}catch(e){}}}
  save();
}
let tt=null; function toast(t){UI.toast=t; clearTimeout(tt); tt=setTimeout(()=>{UI.toast=null; render();},2800); }

  return startScreen();
}

}

/* ---------- Actions ---------- */
function openSheet(id){ S.view="sheet"; S.openId=id; UI.mpane="sheet"; UI.moreOpen=false; }
function makeCopy(src){
  const c=JSON.parse(JSON.stringify(src)); c.id=uid(); c.src="mine"; c.from=src.id;
  c.name=src.src==="starter"?"My "+src.name:src.name+" (copy)"; S.codex.push(c); S.recent=[c.id].concat(S.recent.filter(x=>x!==c.id)); openSheet(c.id);
  toast("Made your own "+src.name+". Change anything you like."); setTimeout(()=>{const n=$("#nm"); if(n){n.focus(); n.select();}},30);
}
function blank(sec){
  const d={weapons:{kind:"weapon",ic:"⚔️",f:{dice:"1d6",dtype:"slashing",hand:"One-handed",mat:"Steel",wt:3,cost:10,cur:"gp",props:[]}},armour:{kind:"armour",ic:"🛡️",f:{ac:12,type:"Light",mat:"Leather",wt:10,cost:10,cur:"gp",stealth:false}},gear:{kind:"gear",ic:"🎒",f:{light:0,dim:0,burn:0,fuel:"None",mat:"Wood",wt:1,cost:1,cur:"gp"}}}[sec];
  const c={id:uid(),sec,src:"mine",name:"New "+secOf(sec)[1].toLowerCase().replace(/s$/,""),line:"",ench:[],...JSON.parse(JSON.stringify(d))};
  S.codex.push(c); S.recent=[c.id].concat(S.recent); openSheet(c.id); setTimeout(()=>{const n=$("#nm"); if(n){n.focus(); n.select();}},30);
}
function addEnch(id){
  const it=byId(S.openId), e=byId(id); if(!it||!e) return;
  if(it.src==="starter"){ toast("Make your own copy first, so the starter stays as it is."); return; }
  it.ench.push(JSON.parse(JSON.stringify(e))); UI.moreOpen=true; toast(e.name+" added to "+it.name);
}

  new(){ S.view="start"; UI.mpane="sheet"; },
  home(){ S.view="start"; UI.mpane="sheet"; },

  set(el){ const it=byId(S.openId); if(!guard(it)) return; const f=el.dataset.f, v=el.dataset.v; if(f==="stealth") it.f.stealth=v==="Disadvantage"; else it.f[f]=v; },
  toggle(el){ const it=byId(S.openId); if(!guard(it)) return; const a=it.f[el.dataset.f]; const v=el.dataset.v; const i=a.indexOf(v); if(i>=0) a.splice(i,1); else a.push(v); },
  step(el){ const it=byId(S.openId); if(!guard(it)) return; const f=el.dataset.f, d=+el.dataset.d; if(f==="wt"&&S.units==="kg"){ it.f.wt=Math.max(0,Math.round((it.f.wt+d/0.4536)*10)/10); } else it.f[f]=Math.max(0,Math.round(((+it.f[f]||0)+d)*10)/10); },
  units(el){ S.units=el.dataset.v; },
  settings(){ UI.modal={type:"settings"}; },
  flags(){ UI.modal={type:"flags"}; },
  close(){ UI.modal=null; },
  scrim(el,e){ if(e.target===el) UI.modal=null; },
  "addmat-ok"(){ const v=($("#newmat").value||"").trim(); if(!v) return; if(!S.mats.includes(v)) S.mats.push(v); const it=byId(S.openId); if(it&&it.src==="mine") it.f.mat=v; UI.modal=null; toast(v+" added to every material list."); },
  cxsec(el){ S.codexSec=el.dataset.sec; S.q=""; },
  cxhome(){ S.codexSec=null; },
  browse(el){ S.codexSec=el.dataset.sec; UI.mpane="codex"; },
  addench(el){ addEnch(el.dataset.id); },
  rmench(el){ const it=byId(S.openId); it.ench.splice(+el.dataset.i,1); },
  enchdice(el){ const it=byId(S.openId); it.ench[+el.dataset.i].f.dice=el.dataset.v; },
  reset(){ try{localStorage.removeItem(KEY);}catch(e){} location.reload(); }
};
function guard(it){ if(it&&it.src==="starter"){ toast("This is the starter version. Tap Make my own copy to change it."); return false; } return !!it; }

app.addEventListener("click",e=>{ const el=e.target.closest("[data-act]"); if(!el) return; if(el.tagName==="SELECT"||el.tagName==="INPUT") return; const fn=A[el.dataset.act]; if(fn){ if(el.dataset.act==="scrim"&&e.target!==el) return; fn(el,e); render(); } });
app.addEventListener("toggle",e=>{ if(e.target.matches&&e.target.matches("details.more")) UI.moreOpen=e.target.open; },true);
app.addEventListener("input",e=>{
  const el=e.target, it=byId(S.openId);
  if(el.dataset.cxq!==undefined){ S.q=el.value; render(); return; }
  if(el.dataset.txt&&it){ if(it.src==="starter"){ el.value=it[el.dataset.txt]||""; toast("This is the starter version. Tap Make my own copy to change it."); render(); return; } it[el.dataset.txt]=el.value; renderSoft(); }
});
function renderSoft(){ clearTimeout(renderSoft.t); renderSoft.t=setTimeout(render,250); }
app.addEventListener("change",e=>{
  const el=e.target, it=byId(S.openId);
  if(el.id==="pic"&&it){ if(!guard(it)) return; const file=el.files&&el.files[0]; if(!file) return; const r=new FileReader(); r.onload=()=>{it.pic=r.result; render();}; r.readAsDataURL(file); return; }
  if(el.dataset.selUi){ S[el.dataset.selUi]=el.value; render(); return; }
  if(el.dataset.move){ const x=byId(el.dataset.move); if(x&&el.value){ x.sec=el.value; toast(x.name+" moved to "+secOf(el.value)[1]+"."); } render(); return; }
  if(el.dataset.num&&it){ if(!guard(it)){render();return;} let v=parseFloat(el.value); if(isNaN(v)) v=0; if(el.dataset.num==="wt"&&S.units==="kg") v=Math.round(v/0.4536*10)/10; it.f[el.dataset.num]=v; render(); return; }
  if(el.dataset.sel&&it){ if(!guard(it)){render();return;} if(el.value==="__add"){ UI.modal={type:"addmat"}; render(); setTimeout(()=>{const n=$("#newmat"); n&&n.focus();},30); return; } it.f[el.dataset.sel]=el.value; render(); }
});
app.addEventListener("keydown",e=>{ if(e.key==="Escape"&&UI.modal){UI.modal=null; render();} if(e.key==="Enter"&&e.target.id==="newmat"){A["addmat-ok"](); render();} });

/* Drag and drop */
let drag=null;
app.addEventListener("dragstart",e=>{ const d=e.target.closest("[data-drag]"); if(!d) return; drag=d.dataset.drag; try{e.dataTransfer.setData("text/plain",drag); e.dataTransfer.effectAllowed="copyMove";}catch(_){} });
app.addEventListener("dragend",()=>{ drag=null; document.querySelectorAll(".over").forEach(x=>x.classList.remove("over")); });
app.addEventListener("dragover",e=>{ const z=e.target.closest("[data-drop]"); if(!z||!drag) return; e.preventDefault(); document.querySelectorAll(".over").forEach(x=>{if(x!==z) x.classList.remove("over");}); if(z.dataset.drop!=="sheet") z.classList.add("over"); });
app.addEventListener("drop",e=>{
  const z=e.target.closest("[data-drop]"); if(!z||!drag) return; e.preventDefault(); const x=byId(drag); drag=null; if(!x) return;
  if(z.dataset.drop==="sec"){ const to=z.dataset.secDrop; if(to!==x.sec){ x.sec=to; toast(x.name+" moved to "+secOf(to)[1]+"."); } render(); return; }
  if(x.kind==="enchant"){ addEnch(x.id); render(); return; }
  if(["weapon","armour","gear"].includes(x.kind)){ openSheet(x.id); render(); return; }
  toast("Drop enchantments onto a weapon, armour or gear sheet."); render();
});

render();
})();
</script>
