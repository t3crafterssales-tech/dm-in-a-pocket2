# Builds the Windows installer on a real Windows computer at GitHub, after running every test.
# The installer appears under the run's "Artifacts" as DM-in-a-Pocket-Windows. Builds of the
# version 2 and version 3 branches also put it on the Releases page as "Latest test version", one plain link.

name: Windows installer

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: DM-in-a-Pocket-Windows
          path: release/*.exe
          if-no-files-found: error
      - name: Put the installer on the Releases page
        if: contains(fromJSON('["claude/v2-modules","claude/v3-table"]'), github.ref_name)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-test --yes --cleanup-tag || true
          gh release create latest-test release/*.exe --prerelease --target "$GITHUB_SHA" \
            --title "Latest test version ($(date -u +'%B %-d, %H:%M') UTC)" \
            --notes "The newest version to try, built from the newest branch: ${{ github.event.head_commit.message || 'manual build' }}. Download the .exe below and run it; it installs over the old one and your worlds stay safe."
