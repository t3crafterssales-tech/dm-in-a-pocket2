# Builds the Windows installer on a real Windows computer at GitHub, after running every test.
# The installer appears under the run's "Artifacts" as DM-in-a-Pocket-Windows.

name: Windows installer

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: DM-in-a-Pocket-Windows
          path: release/*.exe
          if-no-files-found: error
